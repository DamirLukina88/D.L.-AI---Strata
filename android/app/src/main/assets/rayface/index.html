<!doctype html>
<!-- Ray's panda in the Android voice drawer (RayFaceView): the web app's rayface.js, copied here at build time,
     drawn on a transparent page.  No network, no bridge: the app drives him with evaluateJavascript -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #ray-face { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; }
  #ray-face canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body data-theme="dark">
<div id="ray-face"><canvas aria-hidden="true"></canvas></div>
<script src="rayface.js"></script>
<script>
  // the WebView fixes 100vh/100% at load, before the drawer has laid it out (0 px tall): size him in px instead
  const face = document.getElementById("ray-face");
  const fit = () => { face.style.width = innerWidth + "px"; face.style.height = innerHeight + "px"; };
  fit();
  addEventListener("resize", fit);
  RayFace.stay = true;
  RayFace.listen();
</script>
</body>
</html>
